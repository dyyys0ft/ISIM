<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Acceso denegado, sitio en mantenimiento">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fa"/>
      <stop offset="1" stop-color="#d8e5f1"/>
    </linearGradient>
    <linearGradient id="tarjeta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="candado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <filter id="sombraSuave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#fondo)"/>
  <circle cx="90" cy="80" r="120" fill="#ffffff" opacity="0.35"/>
  <circle cx="880" cy="470" r="150" fill="#ffffff" opacity="0.28"/>

  <g filter="url(#sombra)">
    <rect x="180" y="46" width="600" height="448" rx="26" fill="url(#tarjeta)"/>
  </g>

  <!-- Ventana del navegador -->
  <g filter="url(#sombraSuave)">
    <rect x="360" y="82" width="240" height="168" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <path d="M360 116 H600" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="382" cy="99" r="6" fill="#f87171"/>
  <circle cx="402" cy="99" r="6" fill="#fbbf24"/>
  <circle cx="422" cy="99" r="6" fill="#34d399"/>
  <rect x="440" y="90" width="140" height="18" rx="9" fill="#e2e8f0"/>
  <path d="M392 162 H568 M392 186 H540 M392 210 H556" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>

  <!-- Candado -->
  <g filter="url(#sombraSuave)">
    <path d="M444 168 v-24 a36 36 0 0 1 72 0 v24" fill="none" stroke="url(#candado)" stroke-width="14" stroke-linecap="round"/>
    <rect x="424" y="162" width="112" height="86" rx="16" fill="url(#candado)"/>
    <circle cx="480" cy="200" r="11" fill="#ffffff"/>
    <rect x="476" y="205" width="8" height="20" rx="4" fill="#ffffff"/>
  </g>

  <!-- Texto -->
  <text x="480" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">ACCESO DENEGADO</text>
  <text x="480" y="342" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">El sitio está en mantenimiento o su dirección IP</text>
  <text x="480" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">no está autorizada para ingresar.</text>

  <rect x="330" y="402" width="300" height="2" fill="#e2e8f0"/>
  <text x="480" y="442" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748b">ISIM · Sistema de Consentimientos</text>
  <text x="480" y="468" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Comunícate con el administrador de la red</text>
</svg>
