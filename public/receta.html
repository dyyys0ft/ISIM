<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#003f93" />
    <title>ISIM · Receta médica</title>
    <link rel="stylesheet" href="/css/isim.css" />
    <style>
      @media print {
        @page {
          size: A5 landscape;
          margin: 6mm;
        }

        .receta-page-actions,
        .no-print {
          display: none !important;
        }

        .page.container {
          max-width: none !important;
          padding: 0 !important;
        }

        .hoja.receta-doc {
          width: 100% !important;
          max-width: none !important;
          min-height: 0 !important;
          padding: 0 !important;
          border: 0 !important;
          box-shadow: none !important;
        }

        .receta-isim {
          max-width: none;
          font-size: 8.2pt;
        }

        .receta-isim__item,
        .receta-isim__reco,
        .receta-isim__foot {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="receta-page-actions no-print">
      <button class="btn btn--primary" id="btn-imprimir-receta-pagina" type="button">
        Imprimir / Guardar PDF
      </button>
      <button class="btn" id="btn-volver-receta" type="button">Volver</button>
    </div>

    <main class="page container">
      <div class="hoja receta-doc" id="receta-doc">
        <div class="empty">
          <p>Cargando receta médica…</p>
        </div>
      </div>
    </main>

    <script type="module" src="/js/pages/receta.js"></script>
  </body>
</html>
