<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#284f8c" />
    <title>ISIM · Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/isim.css" />
    <link rel="stylesheet" href="/css/pages/acceso.css" />
  </head>
  <body>
    <main class="login" id="acceso">
      <div class="box">
        <img id="acceso-logo" src="/img/isim-logo.png" alt="ISIM" />
        <h1 id="acceso-titulo">Sistema de Consentimientos</h1>
        <p class="sub" id="acceso-sub">ISIM · Instituto de la Salud Integral de la Mujer</p>

        <form class="stack" id="form-login" autocomplete="on" hidden>
          <label class="f">
            <span>Usuario</span>
            <input
              id="login-usuario"
              name="username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              maxlength="32"
              required
            />
          </label>
          <label class="f">
            <span>Contraseña</span>
            <div class="password-field">
              <input
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="128"
                required
              />
              <button class="btn sm" id="btn-ver-password" type="button" aria-label="Mostrar contraseña">
                Ver
              </button>
            </div>
          </label>
          <button class="btn pri" id="btn-ingresar" type="submit">Ingresar</button>
        </form>

        <form class="stack" id="form-instalar" autocomplete="off" hidden>
          <div class="info">
            Primer arranque: crea la cuenta de administrador del sistema.
          </div>
          <div class="grid g2">
            <label class="f">
              <span>Usuario <i class="req">*</i></span>
              <input id="inst-usuario" autocomplete="username" maxlength="32" required />
            </label>
            <label class="f">
              <span>Contraseña <i class="req">*</i></span>
              <input id="inst-password" type="password" autocomplete="new-password" minlength="5" required />
            </label>
          </div>
          <label class="f">
            <span>Nombre completo <i class="req">*</i></span>
            <input id="inst-nombre" autocomplete="name" maxlength="120" required />
          </label>
          <div class="grid g2">
            <label class="f">
              <span>Especialidad</span>
              <input id="inst-especialidad" maxlength="120" />
            </label>
            <label class="f">
              <span>Registro profesional</span>
              <input id="inst-registro" maxlength="60" />
            </label>
          </div>
          <button class="btn pri" id="btn-instalar" type="submit">Crear administrador e ingresar</button>
        </form>

        <p class="ultimo" id="ultimo-acceso" hidden></p>
        <p class="pie"><span data-app-version>v—</span> · ISIM</p>
      </div>
    </main>

    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
